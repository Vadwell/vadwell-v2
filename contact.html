<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Получить рекомендации VadWell</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="contact-container">


<h1>
Получите персональную рекомендацию VadWell
</h1>


<p class="subtitle">
Заполните форму ниже. Мы изучим результат вашего теста и подготовим персональные рекомендации, соответствующие вашему профилю.
</p>



<form id="contactForm">


<label>
Ваше имя
</label>

<input 
type="text"
id="name"
placeholder="Введите имя"
required>



<label>
Телефон
</label>

<input 
type="tel"
id="phone"
placeholder="+7"
required>







<label>
Город
</label>

<input 
type="text"
id="city"
placeholder="Ваш город">



<label class="checkbox">


<input 
type="checkbox"
id="agreement"
required>


Я согласен на обработку моих данных для получения персональной рекомендации VadWell.


</label>



<button 
class="primary-button"
type="submit">

Получить персональную рекомендацию

</button>



</form>


</div>


<script src="js/consultant-loader.js"></script>
<script src="js/contact.js"></script>


</body>

</html>
