<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Получить рекомендации VadWell</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="contact-container">


<h1>
Получите рекомендации по вашему результату
</h1>


<p class="subtitle">
Оставьте контакты, и консультант VadWell
свяжется с вами.
</p>



<form id="contactForm">


<label>
Ваше имя
</label>

<input 
type="text"
id="name"
placeholder="Введите имя"
required>



<label>
Телефон
</label>

<input 
type="tel"
id="phone"
placeholder="+7"
required>



<label>
Telegram (не обязательно)
</label>

<input 
type="text"
id="telegram"
placeholder="@username">



<label>
Город
</label>

<input 
type="text"
id="city"
placeholder="Ваш город">



<label class="checkbox">


<input 
type="checkbox"
id="agreement"
required>


Я согласен получить обратную связь


</label>



<button 
class="primary-button"
type="submit">

Получить рекомендации

</button>



</form>


</div>



<script src="js/contact.js"></script>


</body>

</html>
